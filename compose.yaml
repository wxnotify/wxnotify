services:
    # Server A/B/C profile groups mirror the next-gen plan's ARCH server split
    # (see the plan's "Infrastructure: recommendation" section) so this dev
    # compose file can approximate it: `docker compose up` with no flags starts
    # everything (COMPOSE_PROFILES in .env defaults to all four groups), while
    # e.g. `COMPOSE_PROFILES=server-b,server-c,support docker compose up` drops
    # just the dashboard (server-a) -- proving the alert engine (pipeline-api's
    # ingestion + matching, plus the queue/queue-heartbeat delivery workers,
    # all server-c) runs independently of it. server-a alone still needs
    # server-b (front-end depends_on pgsql/redis) and server-c always needs
    # server-a reachable in a real deployment (its webhook target), so this is
    # a way to trim the pipeline out of a dashboard-only dev session, not true
    # single-server isolation -- see the "server-a" chat discussion.
    #
    # front-end and pipeline-api both build docker/8.4's `web-development`
    # target (fpm-nginx: real PHP-FPM + nginx, not artisan serve) and share
    # one image tag so Compose builds it once; queue/queue-heartbeat build the
    # separate `worker-development` target (cli: no nginx, no Node -- see
    # docker/8.4/Dockerfile's own comments for why each role gets its own
    # stage, and why AUTORUN_* stays off in this dev file). USER_ID/GROUP_ID
    # build args replace Sail's runtime WWWUSER: serversideup's images match
    # the container's www-data uid/gid to the host at BUILD time only
    # (docker-php-serversideup-set-id) -- PUID/PGID env vars don't exist in
    # these images.
    front-end:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            target: web-development
            args:
                USER_ID: '${USER_ID:-1000}'
                GROUP_ID: '${GROUP_ID:-1000}'
        image: 'wxnotify-php/web:local'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:8080'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            PIPELINE_WEBHOOK_TOKEN: '${PIPELINE_WEBHOOK_TOKEN}'
        volumes:
            - '.:/var/www/html'
            - 'nwws-products:/products'
            - 'emwin-products:/emwin-products:ro'
        networks:
            - sail
            - docker-proxy
        depends_on:
            - pgsql
            - redis
#            - minio
            - mailpit
        profiles:
            - server-a
    # The Alert Engine's ingestion entry point: serves only the /api/pipeline/*
    # webhook routes the feed clients below post to. Same image/codebase as
    # front-end (no separate build), but its own process -- this is what
    # lets ingestion, matching, and queued delivery keep running with the
    # dashboard (server-a) stopped entirely. Restricting nginx to just those
    # routes (now that this is real nginx, not the artisan-serve stopgap the
    # Sail image ran) is a deliberate follow-up, not done in this pass -- see
    # the chat discussion on why that needed its own verification.
    pipeline-api:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            target: web-development
            args:
                USER_ID: '${USER_ID:-1000}'
                GROUP_ID: '${GROUP_ID:-1000}'
        image: 'wxnotify-php/web:local'
        container_name: wxnotify-pipeline-api
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            PIPELINE_WEBHOOK_TOKEN: '${PIPELINE_WEBHOOK_TOKEN}'
        ports:
            - '${PIPELINE_API_PORT:-8027}:8080'
        volumes:
            - '.:/var/www/html'
            - 'nwws-products:/products'
            - 'emwin-products:/emwin-products:ro'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
        restart: unless-stopped
        profiles:
            - server-c
    queue:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            target: worker-development
            args:
                USER_ID: '${USER_ID:-1000}'
                GROUP_ID: '${GROUP_ID:-1000}'
        image: 'wxnotify-php/worker:local'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        command: 'php artisan queue:listen --tries=1'
        stop_signal: SIGTERM
        healthcheck:
            test:
                - CMD
                - healthcheck-queue
            start_period: 10s
        restart: unless-stopped
        profiles:
            - server-c
    # Nothing else runs `artisan schedule:run`, so every schedule() entry in
    # bootstrap/app.php (alerts:dispatch-scheduled -- Daily Summary and
    # Threshold deliveries -- plus shapefile:scan, traccar:poll-positions,
    # pipeline:prune-deliveries, bug-reports:sync) would never fire without
    # this. schedule:work is the long-running equivalent of a per-minute cron
    # entry, which a worker-development container has no cron daemon for.
    scheduler:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            target: worker-development
            args:
                USER_ID: '${USER_ID:-1000}'
                GROUP_ID: '${GROUP_ID:-1000}'
        image: 'wxnotify-php/worker:local'
        container_name: wxnotify-scheduler
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        command: 'php artisan schedule:work'
        stop_signal: SIGTERM
        restart: unless-stopped
        profiles:
            - server-c
    queue-heartbeat:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            target: worker-development
            args:
                USER_ID: '${USER_ID:-1000}'
                GROUP_ID: '${GROUP_ID:-1000}'
        image: 'wxnotify-php/worker:local'
        container_name: wxnotify-queue-heartbeat
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        command: 'php artisan queue:work --queue=heartbeat --tries=1'
        stop_signal: SIGTERM
        healthcheck:
            test:
                - CMD
                - healthcheck-queue
            start_period: 10s
        restart: unless-stopped
        profiles:
            - server-c
    nwws:
        build:
            context: .
            dockerfile: docker/nwws/Dockerfile
        container_name: wxnotify-nwws
        environment:
            NWWS_USERNAME: '${NWWS_USERNAME}'
            NWWS_PASSWORD: '${NWWS_PASSWORD}'
            NWWS_ARCHIVEDIR: /products
            NWWS_PAN_RUN: /pan-notify.sh
            NWWS_RETRY: 'true'
            NWWS_WEBHOOK_URL: 'http://pipeline-api:8080/api/pipeline/nwws-products'
            PIPELINE_WEBHOOK_TOKEN: '${PIPELINE_WEBHOOK_TOKEN}'
        volumes:
            - 'nwws-products:/products'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - pipeline-api
        profiles:
            - server-c
    glm-decoder:
        build:
            context: .
            dockerfile: docker/glm-decoder/Dockerfile
        container_name: wxnotify-glm-decoder
        environment:
            GLM_WEBHOOK_URL: 'http://pipeline-api:8080/api/pipeline/glm-flashes'
            PIPELINE_WEBHOOK_TOKEN: '${PIPELINE_WEBHOOK_TOKEN}'
        volumes:
            - 'glm-state:/state'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - pipeline-api
        profiles:
            - server-c
    emwin-byteblaster:
        build:
            context: .
            dockerfile: docker/emwin-byteblaster/Dockerfile
        container_name: wxnotify-emwin-byteblaster
        environment:
            PIPELINE_WEBHOOK_TOKEN: '${PIPELINE_WEBHOOK_TOKEN}'
            EMWIN_WEBHOOK_URL: 'http://pipeline-api:8080/api/pipeline/emwin-products'
            EMWIN_SERVERS_REFRESH_HOURS: '${EMWIN_SERVERS_REFRESH_HOURS:-6}'
            EMWIN_MAX_UNZIP_BYTES: '${EMWIN_MAX_UNZIP_BYTES:-5242880}'
            EMWIN_RETENTION_DAYS: '${EMWIN_RETENTION_DAYS:-7}'
        ports:
            - '${EMWIN_WEB_PORT:-8016}:8016'
        volumes:
            - 'emwin-products:/var/npemwin/files'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - pipeline-api
        profiles:
            - server-c
    emwin-http:
        build:
            context: .
            dockerfile: docker/emwin-http/Dockerfile
        container_name: wxnotify-emwin-http
        environment:
            PIPELINE_WEBHOOK_TOKEN: '${PIPELINE_WEBHOOK_TOKEN}'
            EMWIN_WEBHOOK_URL: 'http://pipeline-api:8080/api/pipeline/emwin-products'
            EMWIN_HTTP_STATE_DIR: /state
            EMWIN_RETENTION_DAYS: '${EMWIN_RETENTION_DAYS:-7}'
        volumes:
            - 'emwin-products:/emwin-products'
            - 'emwin-http-state:/state'
            - './docker/emwin-http/config.json:/config/config.json:ro'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - pipeline-api
        profiles:
            - server-c
    # Stands in for the TLS-gated Docker Engine API exception ARCH describes
    # between Server A and Server C (so Server A's admin tooling can start/stop
    # the pipeline's containers) -- grouped with server-c since it's exposing
    # what would be that server's own daemon.
    docker-socket-proxy:
        image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
        container_name: wxnotify-docker-socket-proxy
        environment:
            CONTAINERS: 1
            ALLOW_START: 1
            ALLOW_STOP: 1
            ALLOW_RESTARTS: 1
            POST: 1
            AUTH: 0
            BUILD: 0
            COMMIT: 0
            CONFIGS: 0
            DISTRIBUTION: 0
            EXEC: 0
            IMAGES: 0
            NETWORKS: 0
            NODES: 0
            PLUGINS: 0
            SECRETS: 0
            SERVICES: 0
            SESSION: 0
            SWARM: 0
            SYSTEM: 0
            TASKS: 0
            VOLUMES: 0
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock:ro'
        networks:
            - docker-proxy
        restart: unless-stopped
        profiles:
            - server-c
    pgsql:
        image: 'imresamu/postgis:18-3.6'
        # Parallel test runs (pest --parallel) migrate one database per worker, and dropping a
        # schema's ~100 tables in several workers at once overflows the default of 64.
        command: ['postgres', '-c', 'max_locks_per_transaction=256']
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
        profiles:
            - server-b
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        profiles:
            - server-b
    # minio:
    #     image: 'minio/minio:latest'
    #     ports:
    #         - '${FORWARD_MINIO_PORT:-9000}:9000'
    #         - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
    #     environment:
    #         MINIO_ROOT_USER: sail
    #         MINIO_ROOT_PASSWORD: password
    #     volumes:
    #         - 'sail-minio:/data'
    #     networks:
    #         - sail
    #     command: 'minio server /data --console-address ":8900"'
    #     healthcheck:
    #         test:
    #             - CMD
    #             - mc
    #             - ready
    #             - local
    #         retries: 3
    #         timeout: 5s
    # No profile: both front-end (server-a) and pipeline-api (server-c)
    # depend_on this directly, so it stays always-on regardless of which
    # profiles are active, rather than forcing "support" to be enabled
    # whenever either of those is.
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # server-c, not support: this is the actual channel-delivery mechanism
    # ChannelDispatcher's queue workers call out to, not a discretionary
    # monitoring/support tool -- server-c should be able to actually deliver
    # alerts on its own.
    apprise:
        image: 'caronc/apprise:latest'
        ports:
            - '${FORWARD_APPRISE_PORT:-8026}:8000'
        networks:
            - sail
        profiles:
            - server-c
    healthchecks:
        image: lscr.io/linuxserver/healthchecks:latest
        environment:
            TZ: 'America/Denver'
            SITE_ROOT: '${HEALTHCHECKS_URL:-http://healthchecks}'
            ALLOWED_HOSTS: '${HEALTHCHECKS_ALLOWED_HOSTS:-*}'
            SITE_NAME: '${HEALTHCHECKS_SITE_NAME:-Healthchecks}'
            DEFAULT_FROM_EMAIL: '${HEALTHCHECKS_DEFAULT_FROM_EMAIL:-healthchecks@host.com}'
            EMAIL_HOST: '${HEALTHCHECKS_EMAIL_HOST:-127.0.0.1}'
            EMAIL_PORT: '${HEALTHCHECKS_EMAIL_PORT:-25}'
            EMAIL_USE_TLS: '${HEALTHCHECKS_EMAIL_USE_TLS:-False}'
            SUPERUSER_EMAIL: '${HEALTHCHECKS_SUPERUSER_EMAIL:-admin@localhost}'
            SUPERUSER_PASSWORD: '${HEALTHCHECKS_SUPERUSER_PASSWORD:-password}'
            DEBUG: 'False'
        volumes:
            - healthchecks:/config:/config
        ports:
            - '${HEALTHCHECKS_PORT:-8000}:8000'
        networks:
            - sail
        profiles:
            - support
networks:
    sail:
        driver: bridge
    docker-proxy:
        driver: bridge
        internal: true
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    # sail-minio:
    #     driver: local
    nwws-products:
        driver: local
    glm-state:
        driver: local
    emwin-products:
        driver: local
    emwin-http-state:
        driver: local
    healthchecks:
        driver: local
