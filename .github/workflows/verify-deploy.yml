# Runs deploy/verify.sh, which checks the published compose files and their
# .env.example files without starting anything. It runs on pushes to main and on
# pull requests that touch deploy/** (or this file), and by hand. No secrets are used.
name: Verify deploy files

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - '.github/workflows/verify-deploy.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/verify-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compose files and .env.example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the tool versions
        run: |
          docker compose version
          jq --version

      - name: Run deploy/verify.sh
        run: bash deploy/verify.sh
